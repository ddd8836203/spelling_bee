<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & iPad 全螢幕支援 (加入主畫面即成獨立 App) -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SpellingBee">
    <meta name="theme-color" content="#22c55e">

    <title>🌟 寶貝英語大冒險 🌟</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti 特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- iPad 專屬樣式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-emerald-50/50 text-slate-800">

    <div class="max-w-4xl mx-auto min-h-screen flex flex-col p-4 sm:p-6 pb-20">
        
        <!-- 表頭 Header -->
        <header class="flex flex-wrap justify-between items-center gap-3 mb-4 bg-white p-4 sm:p-5 rounded-3xl shadow-sm border-2 border-emerald-100 pop-in">
            <h1 class="text-2xl sm:text-3xl font-black text-emerald-600 flex items-center gap-2">
                <span class="bee-float text-3xl">🐝</span> 寶貝英語大冒險
            </h1>

            <div class="flex items-center gap-2">
                <select id="datasetSelector" class="text-base sm:text-lg font-black bg-emerald-100 text-emerald-900 px-4 py-2.5 rounded-2xl border-none outline-none cursor-pointer hover:bg-emerald-200 transition-colors btn-press">
                    <optgroup label="🐝 Spelling Bee Starter A">
                        <option value="sb_Part1" selected>Spelling Bee Part 1</option>
                        <option value="sb_Part2">Spelling Bee Part 2</option>
                        <option value="sb_Part3">Spelling Bee Part 3</option>
                        <option value="sb_Part4">Spelling Bee Part 4</option>
                    </optgroup>
                    <optgroup label="📚 每周學習單字">
                        <option value="ww_Week_5">第 5 週 (Phonics & Reading)</option>
                        <option value="ww_Week_6">第 6 週 (Reading Plus)</option>
                        <option value="ww_Week_7">第 7 週 (Phonics & Reading)</option>
                        <option value="ww_Week_8">第 8 週 (Phonics & Reading)</option>
                        <option value="ww_Week_9">第 9 週 (Phonics & Reading)</option>
                        <option value="ww_Week_10">第 10 週</option>
                        <option value="ww_Week_11">第 11 週</option>
                        <option value="ww_Week_12">第 12 週</option>
                        <option value="ww_Week_13">第 13 週</option>
                        <option value="ww_Week_14">第 14 週</option>
                        <option value="ww_Week_15">第 15 週</option>
                        <option value="ww_Week_16">第 16 週</option>
                        <option value="ww_Week_17">第 17 週</option>
                        <option value="ww_Week_18">第 18 週</option>
                        <option value="ww_Week_19">第 19 週</option>
                    </optgroup>
                </select>
            </div>
        </header>

        <!-- 🐝 小蜜蜂採蜜闖關進度條 (測驗與拼字時顯示) -->
        <div id="bee-progress-bar" class="w-full bg-white p-3.5 rounded-2xl shadow-sm border border-emerald-100 mb-5 pop-in hidden">
            <div class="flex items-center justify-between text-xs sm:text-sm font-black text-slate-500 mb-2 px-1">
                <span id="bee-progress-text">🐝 採集進度：0 / 0</span>
                <span>終點蜂蜜罐 🍯</span>
            </div>
            <!-- 跑道軌道 -->
            <div class="relative w-full h-4 bg-emerald-100 rounded-full overflow-visible flex items-center">
                <!-- 綠色進度條 -->
                <div id="bee-progress-fill" class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
                <!-- 移動的小蜜蜂 -->
                <div id="bee-runner" class="absolute bee-runner text-2xl -top-3 transform transition-all duration-300" style="left: -16px;">
                    🐝
                </div>
            </div>
        </div>

        <!-- 導航列 Tabs (4大模式) -->
        <nav class="grid grid-cols-4 gap-2 sm:gap-4 mb-6 pop-in" style="animation-delay: 0.1s;">
            <!-- 1. 學習單字 -->
            <button data-tab="learn" class="tab-btn bg-blue-500 text-white flex flex-col items-center justify-center p-3 sm:p-4 rounded-3xl shadow-md btn-press transition-all duration-200">
                <span class="text-3xl sm:text-4xl mb-1">📖</span>
                <span class="font-black text-sm sm:text-base">學習單字</span>
            </button>
            <!-- 2. 看圖口說 -->
            <button data-tab="speak" class="tab-btn bg-amber-400 text-amber-950 flex flex-col items-center justify-center p-3 sm:p-4 rounded-3xl shadow-md btn-press opacity-50 transition-all duration-200">
                <span class="text-3xl sm:text-4xl mb-1">🗣️</span>
                <span class="font-black text-sm sm:text-base">看圖口說</span>
            </button>
            <!-- 3. 聽音拼寫 -->
            <button data-tab="write" class="tab-btn bg-purple-500 text-white flex flex-col items-center justify-center p-3 sm:p-4 rounded-3xl shadow-md btn-press opacity-50 transition-all duration-200">
                <span class="text-3xl sm:text-4xl mb-1">✍️</span>
                <span class="font-black text-sm sm:text-base">聽音拼寫</span>
            </button>
            <!-- 4. 怪獸本 -->
            <button data-tab="review" class="tab-btn bg-rose-500 text-white flex flex-col items-center justify-center p-3 sm:p-4 rounded-3xl shadow-md btn-press opacity-50 transition-all duration-200 relative">
                <span class="text-3xl sm:text-4xl mb-1">👾</span>
                <span class="font-black text-sm sm:text-base">怪獸本</span>
                <span id="monster-badge" class="absolute -top-1.5 -right-1.5 bg-white text-rose-600 font-black rounded-full w-7 h-7 flex items-center justify-center border-2 border-rose-500 shadow-sm text-xs hidden">0</span>
            </button>
        </nav>

        <!-- 主要動態內容渲染區 -->
        <main id="main-content" class="flex-grow flex flex-col pop-in" style="animation-delay: 0.15s;">
            <!-- 由 js/app.js 動態渲染 -->
        </main>

    </div>

    <!-- 載入資料庫與模組 -->
    <script src="data/spelling_bee.js"></script>
    <script src="data/weekly_words.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
