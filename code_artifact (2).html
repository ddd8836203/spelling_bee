<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 寶貝英語大冒險 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- 加入 Confetti 煙火特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* 淺綠色背景，保護眼睛 */
            -webkit-tap-highlight-color: transparent;
        }

        /* 隱藏捲軸但保持可捲動 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* 點擊按鈕的縮放回饋效果 */
        .btn-press {
            transition: transform 0.1s, filter 0.1s;
        }
        .btn-press:hover {
            filter: brightness(0.95);
        }
        .btn-press:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        /* 注音符號樣式調整，確保清晰 */
        ruby {
            ruby-position: over;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e293b;
        }
        rt {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: normal;
        }

        /* 字母發音時的高亮動畫 */
        .letter-highlight {
            color: #ef4444 !important; /* 紅色 */
            transform: scale(1.3) translateY(-5px);
            text-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .letter-transition {
            transition: all 0.2s ease-in-out;
            display: inline-block;
        }

        /* 錯題怪獸吃掉單字的動畫 */
        @keyframes monsterEat {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            20% { transform: scale(1.1) rotate(-10deg); color: #ef4444; }
            40% { transform: scale(1.1) rotate(10deg); }
            100% { transform: scale(0) translate(0, -200px); opacity: 0; filter: blur(5px); }
        }
        .animate-eat {
            animation: monsterEat 1s cubic-bezier(0.5, 0, 0.5, 1) forwards;
            pointer-events: none;
        }

        /* 簡單的彈跳進場動畫 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>

                    spans.forEach(s => s.classList.remove('letter-highlight')); 
                    if(spans[i]) spans[i].classList.add('letter-highlight'); 
                }

                if (letter.trim() === '' || letter === '-') {
                     await new Promise(resolve => setTimeout(resolve, 400));
                     continue;
                }

                const utterance = new SpeechSynthesisUtterance(letter.toUpperCase() + ",");
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                synth.speak(utterance);

                await new Promise(resolve => setTimeout(resolve, 800));
            }
            
            if (currentSpellToken !== myToken) return;
            
            if (spans.length > 0) {
                spans.forEach(s => s.classList.remove('letter-highlight'));
            }
            speakEnglish(word, 1); 
        }

            return chineseArr.map(item => `<ruby>${item.c}<rt>${item.p}</rt></ruby>`).join('');

                    <button onclick="resetQuizState(); renderCurrentTab();" class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-4 px-10 rounded-full shadow-lg btn-press transition-colors">
                        再玩一次 🔄
                    </button>
                </div>
            `;
            
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6']
                });
            }

            if (synth) {
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance("You are amazing!");
                    utterance.lang = 'en-US';
                    utterance.rate = 1;
                    synth.speak(utterance);
                }, 500);
            }
        }

        window.onload = init;

    </script>
</body>
</html>
